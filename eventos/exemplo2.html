<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos JavaScript</title>
</head>
<body>
    <h1>Eventos JavaScript</h1>

    <button id="btnMensagem">Clique aqui!</button>


    <script>
        document.querySelector("#btnMensagem").onclick = () => {
            alert("Seja bem vindo!");
        }
    </script>
</body>
</html>
